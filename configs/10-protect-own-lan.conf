# Drop-in for travel-ap-net.service:
#   /etc/systemd/system/travel-ap-net.service.d/10-protect-own-lan.conf
#
# With Tailscale `--accept-routes` on, the home subnet (192.168.0.0/24) is
# installed in the Pi's routing table. AT HOME the Pi is *on* that subnet, so
# without this rule the Pi would route its own LAN traffic back through the
# tunnel and become unreachable/asymmetric on the LAN.
#
# This keeps the Pi's OWN traffic to the home LAN on eth0 (priority 50, above
# Tailscale's rules), while FORWARDED Firestick traffic (iif wlan0) still uses
# the tunnel table for split-tunnel access to home Jellyfin.
[Service]
ExecStart=-/sbin/ip rule del iif lo to 192.168.0.0/24 lookup main priority 50
ExecStart=/sbin/ip rule add iif lo to 192.168.0.0/24 lookup main priority 50
